name: Qwen3 BAP Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run_benchmark:
    uses: google-ml-infra/bap/.github/workflows/run_benchmarks.yml@main

    with:
      registry_file: "./benchmark_registry.pbtxt"

      benchmark_filter: "qwen3_4b_v6e1"

      environment_filter: "qwen3_v6e1"

      bap_ref: "main"

      publish_metrics: false

      post_pr_comment: false

      custom_env_vars: |
        GCP_PROJECT=${{ vars.GCP_PROJECT }}
        TPU_ZONE=${{ vars.TPU_ZONE }}
        TPU_NAME=${{ vars.TPU_NAME }}
        GCP_WORKLOAD_IDENTITY_PROVIDER=${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        GCP_SERVICE_ACCOUNT=${{ vars.GCP_SERVICE_ACCOUNT }}

    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
